# Type-checks and tests the website and the API on every pull request.
# The database tests (tests/*.integration.test.ts) skip themselves here: they
# need a Neon database, so they run only where DATABASE_URL is set (locally).
name: Website and API

on:
  pull_request:
    paths-ignore: ['ios/**', 'android/**']
  push:
    branches: [main]
    paths-ignore: ['ios/**', 'android/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Website and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
