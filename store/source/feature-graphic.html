<!doctype html>
<!-- Google Play feature graphic, 1024x500. Rendered to

<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{display:flex;background:linear-gradient(120deg,#FBEDE9 0%,#F4EEF8 45%,#E8E1F2 100%);font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#2D3436}
  .text{width:470px;padding:0 0 0 64px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:52px;height:auto}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:58px;margin:0;letter-spacing:-.5px}
  h1{color:#C8815A} h1 .v{color:#6A9478}
  p{font-size:23px;line-height:1.45;margin:26px 0 0;color:#4a5355;max-width:380px}
  .amrita{margin-top:22px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#72618F;font-weight:500}
  .scene{flex:1;position:relative}
  .scene img{position:absolute;inset:40px 40px 40px 10px;width:calc(100% - 50px);height:420px;object-fit:cover;border-radius:28px;box-shadow:0 24px 60px rgba(138,121,165,.25)}
</style></head>
<body>
  <div class="text">
    <div class="brand"><img src="pranaveda_icon.svg" alt=""><h1>Prana<span class="v">Veda</span></h1></div>
    <p>Yoga, breathwork and Ayurveda, shaped to how you feel today.</p>
    <div class="amrita">With Amrita, your guide</div>
  </div>
  <div class="scene"><img src="triangle_wide.webp" alt=""></div>
