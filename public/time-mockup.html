<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PranaVeda — Time-Aware Background Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1a1a;
      padding: 32px 24px;
      min-height: 100vh;
    }

    h1 {
      color: #ccc;
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 9 / 16;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .panel svg.blobs {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: blur(60px);
      opacity: 0.55;
    }

    .panel svg.lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.2;
    }

    .panel svg.lotus {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 72px;
      height: 72px;
      opacity: 0.18;
    }

    .label {
      position: relative;
      z-index: 2;
    }

    .time {
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .name {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .chip {
      position: relative;
      z-index: 2;
      display: inline-block;
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.6);
    }

    /* ── DAWN ── */
    .dawn {
      background-color: #FFFBF5;
      background-image:
        radial-gradient(circle at 10% 10%, #FAD9C8 0%, transparent 50%),
        radial-gradient(circle at 88% 12%, #FDE8C0 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, #FBDDC8 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, #FDE5CC 0%, transparent 50%);
    }
    .dawn .time { color: #B5714A; }
    .dawn .name { color: #7A4A28; }
    .dawn .chip { color: #9A5E3A; }
    .dawn svg.lines path, .dawn svg.lines circle { stroke: #C8855A; fill: none; }
    .dawn svg.lotus path, .dawn svg.lotus circle { stroke: #9A6040; fill: none; }

    /* ── MORNING ── */
    .morning {
      background-color: #FAFEFF;
      background-image:
        radial-gradient(circle at 10% 10%, #DAEEF8 0%, transparent 50%),
        radial-gradient(circle at 88% 12%, #E4E0F5 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, #D5F2EA 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, #DFF0FB 0%, transparent 50%);
    }
    .morning .time { color: #4A7E9E; }
    .morning .name { color: #2A5A70; }
    .morning .chip { color: #4A7E9E; }
    .morning svg.lines path, .morning svg.lines circle { stroke: #6AAAC0; fill: none; }
    .morning svg.lotus path, .morning svg.lotus circle { stroke: #5A8FA0; fill: none; }

    /* ── AFTERNOON ── */
    .afternoon {
      background-color: #FDFAF5;
      background-image:
        radial-gradient(circle at 10% 10%, #FDE8CC 0%, transparent 50%),
        radial-gradient(circle at 88% 12%, #E5EDD8 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, #F8E0D0 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, #EEE8D5 0%, transparent 50%);
    }
    .afternoon .time { color: #7A6A3A; }
    .afternoon .name { color: #5A4A20; }
    .afternoon .chip { color: #7A6A3A; }
    .afternoon svg.lines path, .afternoon svg.lines circle { stroke: #A09050; fill: none; }
    .afternoon svg.lotus path, .afternoon svg.lotus circle { stroke: #8A7040; fill: none; }

    /* ── DUSK ── */
    .dusk {
      background-color: #FDF5F5;
      background-image:
        radial-gradient(circle at 10% 10%, #F5C8C8 0%, transparent 50%),
        radial-gradient(circle at 88% 12%, #F5CCC0 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, #EAC8E5 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, #F0C8E0 0%, transparent 50%);
    }
    .dusk .time { color: #8A4A5A; }
    .dusk .name { color: #6A2A3A; }
    .dusk .chip { color: #8A4A5A; }
    .dusk svg.lines path, .dusk svg.lines circle { stroke: #B06070; fill: none; }
    .dusk svg.lotus path, .dusk svg.lotus circle { stroke: #904858; fill: none; }

    /* ── NIGHT ── */
    .night {
      background-color: #EEEDF8;
      background-image:
        radial-gradient(circle at 10% 10%, #C8C5E8 0%, transparent 50%),
        radial-gradient(circle at 88% 12%, #CCCAE8 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, #C0C5E5 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, #CCCAE8 0%, transparent 50%);
    }
    .night .time { color: #5A5A8A; }
    .night .name { color: #3A3A6A; }
    .night .chip { color: #5A5A8A; }
    .night svg.lines path, .night svg.lines circle { stroke: #7878A8; fill: none; }
    .night svg.lotus path, .night svg.lotus circle { stroke: #6060A0; fill: none; }
  </style>
</head>
