# The Xcode project is generated from this file (`xcodegen` in this folder),
# so it stays readable in reviews. Do not edit PranaVeda.xcodeproj by hand.
name: PranaVeda
options:
  bundleIdPrefix: com.pranaveda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    # 9.0 added the sign-in nonce the server requires.
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PranaVeda:
    type: application
    platform: iOS
    sources: [PranaVeda, Shared]
    dependencies:
      - target: PranaVedaWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    # The server address, app identifier and signing team come from here, so
    # each machine can set its own in the git-ignored Local.xcconfig.
    configFiles:
      Debug: Configuration/App.xcconfig
      Release: Configuration/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PV_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: PranaVeda
        # The lotus from the website, rendered by scripts/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # PranaVeda's design is light only, like the website: the app paints its
        # own light background, so Dark Mode's white system text would vanish.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
    info:
      path: PranaVeda/Info.plist
      properties:
        PVAPIBaseURL: $(PV_API_BASE_URL)
        # YES when the build has the Sign in with Apple capability
        # (PV_APPLE_SIGN_IN in Configuration/App.xcconfig).
        PVAppleSignInEnabled: $(PV_APPLE_SIGN_IN)
        # The App Group shared with the widgets (Shared/WidgetSnapshot.swift).
        PVAppGroup: group.$(PV_BUNDLE_ID)
        # A practice shows on the lock screen and in the Dynamic Island while
        # it runs (Shared/PracticeActivity.swift).
        NSSupportsLiveActivities: true
        # Siri also knows the app as "Amrita": "Hey Siri, talk to Amrita"
        # (App/PranaVedaShortcuts.swift).
        INAlternativeAppNames:
          - INAlternativeAppName: Amrita
            INAlternativeAppNamePronunciationHint: ahm-REE-tah
        # The website's typefaces, bundled (PranaVeda/Fonts, SIL Open Font
        # License): Playfair Display for headings, Plus Jakarta Sans for text.
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - PlusJakartaSans.ttf
          - PlusJakartaSans-Italic.ttf
        # Plain http is allowed for the local network only (the dev server);
        # everything on the internet still needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google sign-in reads its client id from here, and returns to the
        # app through the reversed-id URL scheme.
        GIDClientID: $(PV_GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(PV_GOOGLE_URL_SCHEME)]
          # The widgets' links: pranaveda://talk, pranaveda://ritual/<id>, …
          - CFBundleURLSchemes: [pranaveda]
        # Shown by iOS the first time a phone build reaches the Mac.
        # Speaking to Amrita: the words are recognised on the phone where it
        # can, and only the text is sent.
        NSMicrophoneUsageDescription: PranaVeda listens while you speak to Amrita, so you can tell her how you feel out loud.
        NSSpeechRecognitionUsageDescription: Your words are turned into text so Amrita can read what you said.
        # Recovery & Trends reads sleep, resting heart rate and HRV from Apple
        # Health, on the phone only (Models/HealthStore.swift).
        NSHealthShareUsageDescription: PranaVeda shows your sleep, resting heart rate and heart-rate variability beside your practice. They are read on this phone, and a short summary goes to Amrita only if you turn that on.
        NSLocalNetworkUsageDescription: PranaVeda connects to the PranaVeda server running on your Mac while the app is in development.
  # Home-screen and lock-screen widgets. They read the snapshot the app
  # writes into the shared App Group, and never call the server.
  PranaVedaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PranaVedaWidgets
      - Shared
      - path: PranaVeda/Fonts
        buildPhase: resources
        includes: ["*.ttf"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    configFiles:
      Debug: Configuration/App.xcconfig
      Release: Configuration/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PV_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: PranaVedaWidgets/PranaVedaWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PranaVeda
        SKIP_INSTALL: YES
    info:
      path: PranaVedaWidgets/Info.plist
      properties:
        PVAppGroup: group.$(PV_BUNDLE_ID)
        UIAppFonts:
          - PlayfairDisplay.ttf
          - PlayfairDisplay-Italic.ttf
          - PlusJakartaSans.ttf
          - PlusJakartaSans-Italic.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PranaVedaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PranaVedaTests]
    dependencies:
      - target: PranaVeda
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PranaVeda:
    build:
      targets:
        PranaVeda: all
        PranaVedaTests: [test]
    test:
      targets: [PranaVedaTests]
